services:
  - type: web
    name: liangrenshi
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Use the existing service's exact display name in the same workspace.
      - key: DB_HOST
        fromService: { type: web, name: dreamStudy, envVarKey: DB_HOST }
      - key: DB_PORT
        fromService: { type: web, name: dreamStudy, envVarKey: DB_PORT }
      - key: DB_USER
        fromService: { type: web, name: dreamStudy, envVarKey: DB_USER }
      - key: DB_PASSWORD
        fromService: { type: web, name: dreamStudy, envVarKey: DB_PASSWORD }
      - key: DB_NAME
        fromService: { type: web, name: dreamStudy, envVarKey: DB_NAME }
      - key: DB_CA
        fromService: { type: web, name: dreamStudy, envVarKey: DB_CA }
      - key: KITCHEN_CUSTOMER_PASSWORD
        sync: false
      - key: KITCHEN_CHEF_PASSWORD
        sync: false
      - key: KITCHEN_SESSION_SECRET
        generateValue: true
